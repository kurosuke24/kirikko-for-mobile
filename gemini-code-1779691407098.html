<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>きりっこひろば 出欠受付＆リアルタイム在室管理</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: "Yu Gothic", "游ゴシック", sans-serif; 
      margin: 0; 
      padding: 15px; 
      background: #eef2f3; 
      color: #333; 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh;
    }
    h2 { margin: 0 0 10px 0; text-align: center; color: #2c3e50; font-size: 1.5rem; }

    #date-warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: none; font-size: 13px; }
    #date-warning.show { display: block; }

    /* メインコンテナ：PCでは横並び、スマホでは縦並び（レスポンシブ） */
    .main-container { 
      display: flex; 
      flex-direction: row;
      flex: 1; 
      gap: 15px; 
      min-height: 0; 
    }

    /* 左側：カメラ・受付エリア */
    .left-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
    #video-container { position: relative; width: 100%; max-width: 440px; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    video { width: 100%; height: 100%; object-fit: cover; }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #result-box { width: 100%; max-width: 400px; margin-top: 15px; padding: 0 15px; border-radius: 8px; font-size: 20px; font-weight: bold; text-align: center; height: 64px; display: flex; align-items: center; justify-content: center; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    /* 右側：リアルタイム状況確認エリア */
    .right-panel { flex: 1.2; display: flex; gap: 15px; background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .status-column { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
    .column-title { font-size: 18px; font-weight: bold; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 10px; }
    .inside-title { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .outside-title { background: #eceff1; color: #455a64; border: 1px solid #cfd8dc; }

    /* 児童リスト */
    .member-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; border: 1px solid #eee; border-radius: 6px; background: #fafafa; min-height: 200px; }
    .member-item { padding: 12px 10px; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; font-size: 19px; background: #fff; }
    .member-item:last-child { border-bottom: none; }
    .member-info { font-weight: bold; }
    .member-time { font-size: 12px; color: #718096; background: #edf2f7; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .empty-list { text-align: center; color: #999; padding: 30px 10px; font-size: 14px; }

    /* 下部：ボタンエリア */
    .bottom-panel { margin-top: 15px; text-align: center; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button { padding: 12px 24px; font-size: 15px; font-weight: bold; color: #fff; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    .btn-primary { background: #3498db; }
    .btn-primary:hover { background: #2980b9; }
    .btn-danger { background: #e74c3c; }
    .btn-danger:hover { background: #c0392b; }

    /* ステータスカラー */
    .success { color: #155724; background: #d4edda !important; border: 2px solid #c3e6cb; }
    .leave { color: #0c5460; background: #d1ecf1 !important; border: 2px solid #bee5eb; }
    .error { color: #721c24; background: #f8d7da !important; border: 2px solid #f5c6cb; }
    .scanning { color: #7f8c8d; }

    /* 経過時間バッジ */
    .member-elapsed {
      font-size: 13px; font-weight: bold; padding: 3px 8px;
      border-radius: 12px; margin-left: 8px; white-space: nowrap;
      background: #e8f5e9; color: #2e7d32;
    }
    .member-elapsed.warn  { background: #fff8e1; color: #f57f17; }
    .member-elapsed.alert { background: #fdecea; color: #c62828; }

    /* 時計 */
    #clock-box {
      width: 100%; max-width: 400px; margin-top: 12px;
      background: #fff; border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      padding: 14px 10px 10px;
      text-align: center;
    }
    #clock-time {
      font-size: 52px; font-weight: bold; letter-spacing: 3px;
      color: #2c3e50; font-variant-numeric: tabular-nums;
      font-family: "Yu Gothic", monospace;
      line-height: 1;
    }
    #clock-date {
      font-size: 20px; color: #718096; margin-top: 6px;
    }

    /* スマートフォン向けのスタイル調整 */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        overflow: visible;
      }
      .right-panel {
        flex-direction: column;
        height: auto;
      }
      .status-column {
        margin-bottom: 15px;
      }
      #clock-time {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <h2>きりっこひろば出欠受付 ＆ リアルタイム在室管理</h2>
  <div id="date-warning"></div>

  <div class="main-container">
    <div class="left-panel">
      <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
      <div id="result-box" class="scanning">カメラを起動中...</div>
      <div id="clock-box">
        <div style="font-size:20px;font-weight:bold;color:#718096;margin-bottom:4px;letter-spacing:2px">現在時刻</div>
        <div id="clock-time">--:--:--</div>
        <div id="clock-date"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="status-column">
        <div class="column-title inside-title">現在いる子（在室中） <span id="count-inside">0</span>名</div>
        <ul id="list-inside" class="member-list"></ul>
      </div>
      <div class="status-column">
        <div class="column-title outside-title">すでに帰った子（帰宅済） <span id="count-outside">0</span>名</div>
        <ul id="list-outside" class="member-list"></ul>
      </div>
    </div>
  </div>

  <div class="bottom-panel">
    <button class="btn-primary" onclick="downloadCSV()">本日の出欠ログ（CSV）を保存する</button>
    <button class="btn-danger" onclick="resetToday()">本日分をリセット</button>
  </div>
